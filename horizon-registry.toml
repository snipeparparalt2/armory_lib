# Read by the Horizon mod registry from the newest release's tag. Entries set in the registry win.
name = "Armory Lib"
summary = "Library for native mods: custom mob looks and rules, effects from carried items, coloured gear light and settings pages."
description = """
A native library mod. It does nothing on its own: install it when a mod you use asks for it
(Useful Armory does).

For mod authors, it turns a few lines of registration into working features, using only Horizon's
catalog hooks:

- Mob looks: draw a mod entity type with its own texture and glowing layer on a vanilla body.
- Mob rules: stop a copied mob converting or dying from burning, and give its hits an effect.
- Carried-item effects: an effect while an item is held, in the hotbar, worn, or worn as a full set.
- Coloured gear light: items that light the world in their colour, held, worn or dropped.
- Settings pages: a row in Options > Mods with one switch per feature.

One file: armory_lib-<version>.hnmod goes in horizon-native-mods/.
"""
authors = ["snipeparpar"]
license = "MPL-2.0"
categories = ["library", "utility"]
