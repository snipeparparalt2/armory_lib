# Armory Lib: a native library mod. It carries out what content mods declare in their
# `data/<mod id>/armory_lib.json`, so they need no code of their own.
#
# It is a plain mixin bundle (Horizon docs/native-mods.md): modules added to the game and
# injections at the head of the game's own `native_*` hook functions. It has no `[api]`
# package, so the launcher builds the game as it is and needs no generated executable.
[mod]
id = "armory_lib"
version = "0.1.0-creatures.1"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# `bridge.rs` is added to the game's client library as the public module
# `horizon_client::armory_lib_bridge`: what all the parts share (the gear rules read from the
# mods' files, their logic, the switches, the daylight list), reachable from the mob code the
# sunburn injection runs in.
[[module]]
id = "bridge"
file = "crates/horizon-client/src/client_lib.rs"
name = "armory_lib_bridge"
source = "bridge.rs"
visibility = "pub"

# `logic.rs`: the sums of the catalog hooks, with nothing from the game in it.
[[module]]
id = "logic"
file = "crates/horizon-client/src/game.rs"
name = "armory_lib_logic"
source = "logic.rs"
visibility = "pub"

# `hooks.rs`: the catalog hooks (mob looks, mob rules, carried-item effects, gear light,
# settings pages) and the `register_*` functions other native mods can call, as
# `horizon_client::game::armory_lib`.
[[module]]
id = "hooks"
file = "crates/horizon-client/src/game.rs"
name = "armory_lib"
source = "hooks.rs"
visibility = "pub"

# `goals.rs`: as each mob is made, a companion type gets a tame wolf's goals and a type with
# sounds of its own gets them. In the client library, beside the mob code it hooks.
[[module]]
id = "goals"
file = "crates/horizon-client/src/client_lib.rs"
name = "armory_lib_goals"
source = "goals.rs"

# `store.rs`: what the library keeps for a world, in `<world>/armory_lib/`, and small item
# helpers (custom data, ids).
[[module]]
id = "store"
file = "crates/horizon-client/src/game.rs"
name = "armory_lib_store"
source = "store.rs"

# `gear.rs` runs the gear rules, companions and rare variants in the game. It reads the player's break, the mob list and
# block facts straight from `Game`, and `sunburn.rs` hooks a raw target, so the library is
# pinned to the Horizon commit above.
[[module]]
id = "gear"
file = "crates/horizon-client/src/game.rs"
name = "armory_lib_gear"
source = "gear.rs"

# The catalog hooks: the mods' files read when the data or the resources reload, the pages
