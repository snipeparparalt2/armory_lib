# Runs the library's pure logic and its tests without the game: `cargo test`.
# The game gets these files through the mixin bundle in mixins/armory_lib/.
[package]
name = "armory-lib-logic"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[lib]
path = "mixins/armory_lib/logic.rs"

# The half added to the game's client library: gear rules and their logic.
[[test]]
name = "bridge"
path = "mixins/armory_lib/bridge.rs"

# Backpacks and soul jars: their rules from the mods' files and their sums.
[[test]]
name = "packs"
path = "mixins/armory_lib/packs_logic.rs"

# Waystones and the recall charm: their files, the registry, the menu's order, the cooldowns.
[[test]]
name = "ways"
path = "mixins/armory_lib/ways_logic.rs"

# Trinket slots: what the mods declare for them, and the sums (no game types).
[[test]]
name = "trinkets"
path = "mixins/armory_lib/trinkets_logic.rs"

# ---- Batch C: soul forge and upgrades ----

# ---- Batch C: soul pool and charged attacks ----
# The soul pool, charged attacks, soul weapons and soul stealing: what the files declare, the sums.
[[test]]
name = "souls"
path = "mixins/armory_lib/souls_logic.rs"

# ---- Batch C: creatures and bosses ----

# ---- Batch C: citadel, door and map scrap ----

[dependencies]
serde_json = "1"
