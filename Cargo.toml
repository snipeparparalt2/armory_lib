# Runs the library's pure logic and its tests without the game: `cargo test`.
# The game gets these files through the mixin bundle in mixins/armory_lib/.
[package]
name = "armory-lib-logic"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[lib]
path = "mixins/armory_lib/logic.rs"

# The half added to the game's client library: gear rules and their logic.
[[test]]
name = "bridge"
path = "mixins/armory_lib/bridge.rs"

[dependencies]
serde_json = "1"
